<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#C62828">
  <title>Masuk • KASIRUQ</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E🍗%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="login">
    <header class="login-hero">
      <div class="logo-badge" aria-hidden="true">🍗</div>
      <h1>KASIRUQ</h1>
      <p>Kasir Farouq Fried Chicken</p>
    </header>

    <main class="login-card">
      <h2>Hai, selamat datang 👋</h2>
      <p class="sub">Masuk dulu untuk mulai jualan.</p>

      <form id="form" novalidate>
        <div class="err" id="err" role="alert" hidden></div>
        <div class="field">
          <label class="field-label" for="username">Username</label>
          <input class="input" id="username" type="text" autocomplete="username" autocapitalize="none" placeholder="contoh: kasir1">
        </div>
        <div class="field">
          <label class="field-label" for="password">Password</label>
          <div class="pw">
            <input class="input" id="password" type="password" autocomplete="current-password" placeholder="••••••••">
            <button type="button" id="eye" aria-label="Tampilkan password">👁️</button>
          </div>
        </div>
        <button class="btn btn-primary btn-block" id="btn" type="submit">Masuk</button>
      </form>

      <div class="demo-hint" id="demoHint">
        <b>Mode demo</b> (data dummy). Coba login:<br>
        Pemilik: <b>pemilik</b> / <b>demo123</b><br>
        Kasir: <b>kasir1</b> / <b>demo123</b>
      </div>
    </main>

    <p class="login-foot">FAROUQ FRIED CHICKEN • sejak Agustus 2023</p>
  </div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
